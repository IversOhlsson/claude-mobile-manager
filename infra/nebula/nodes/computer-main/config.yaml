pki:
  ca: /etc/nebula/ca.crt
  cert: /etc/nebula/computer-main.crt
  key: /etc/nebula/computer-main.key

# Replace 158.179.200.104 after terraform apply
static_host_map:
  "10.0.0.254": ["158.179.200.104:4242"]

lighthouse:
  am_lighthouse: false
  interval: 60
  hosts:
    - "10.0.0.254"

listen:
  host: 0.0.0.0
  port: 4242

punchy:
  punch: true
  respond: true

tun:
  dev: nebula1
  drop_local_broadcast: false
  drop_multicast: false

logging:
  level: info
  format: text

# Allow traffic from "machines" group and "phone" group
firewall:
  conntrack:
    tcp_timeout: 12m
    udp_timeout: 3m
    default_timeout: 10m

  outbound:
    - port: any
      proto: any
      group: machines
    - port: any
      proto: any
      group: phone

  inbound:
    - port: any
      proto: any
      group: machines
    - port: any
      proto: any
      group: phone
